# skate3_dedicated configuration.
# Command-line flags override anything set here, so one config can back
# several servers (e.g. --port=27201 --admin-port=27281).

sv_hostname "Skate 3 Dedicated"
sv_maxplayers 16

# Shared secret clients must present to connect. Leave empty for an open
# server; anyone who can reach the port can then join.
sv_token ""

sv_port 27200
sv_adminport 27280
sv_resources "resources"

# Interest management. Peers past sv_radius are not relayed to each other at
# all; 0 means unlimited. The fidelity bands below thin what does get sent:
#
#   within fidelity_high    full stream
#   within fidelity_medium  half the pose deltas
#   within fidelity_low     keyframes only, no deltas
#   beyond fidelity_low     nothing
#
# Deltas are encoded against a baseline rather than against each other, so
# dropping them is safe - the far skater's pose just updates less often.
# Keyframes are never dropped: the receiver would notice the gap and ask for
# a fresh baseline, which is larger than the deltas withheld.
sv_radius 500
fidelity_high 100
fidelity_medium 250
fidelity_low 500

# Hot zones. Distance banding alone bounds nothing when everyone gathers on
# the same ledge: the relay's egress is (senders x recipients), so sixty
# players on one spot are all inside each other's high band and each pays
# for the other fifty-nine at full fidelity.
#
# These are NEIGHBOUR COUNTS within fidelity_high. Past crowd_medium_above
# neighbours, everyone in that crowd drops one fidelity band; past
# crowd_low_above, two. Per-peer cost therefore falls as a crowd grows,

# Animation rate per fidelity band, in Hz.
#
# # Root-snapshot rate in Hz: how often a client sends its position and
# orientation, separate from the animation pose above.
#
# This defaulted to 60 while animation ran at 10-12, which made position a
# fifth of the whole stream - six updates per pose, for detail interpolation
# already covers. 30 is smooth and halves that cost; 20 is still fine.
pose_hz 30

# Refresh rate for the finger and face bones, in Hz.
#
# These two groups are ~64 of the ~106 bones a receiver actually uses, so
# they dominate the stream - for knuckle articulation and facial expression
# on a player several metres away.
#
# Between refreshes they are NOT frozen in place: a finger rides its hand and
# a face bone rides the head, so the pose stays real and correctly attached,
# it just stops re-articulating. Freezing them in world space instead
# stretched the arms across the scene.
#
# Set equal to high_hz for every-frame updates, or 0 for keyframes only.
# Fingers are worth spending on - a board grab or a handplant is all hands.
# Facial expression is not resolvable at skating distance.
hands_hz 3
face_hz 0

# Animation rate per fidelity band, in Hz.
#
# high_hz is what connected CLIENTS are told to send at - the relay can thin
# a stream down for distant players but cannot invent samples that were never
# sent, so the ceiling is set here at the source. medium_hz and low_hz are
# what the relay thins that down to for players in the matching distance or
# crowd band, rounded to the nearest whole divisor of high_hz.
#
# Cost scales with how many players each client has to receive. A 4-8 player
# server can afford 20/15/10; a 20+ player server wants something like
# 12/8/4. Lower high_hz is the single biggest bandwidth lever available -
# receiver-side interpolation fills in between samples.
high_hz 20
medium_hz 10
low_hz 5
# which keeps each client's inbound roughly flat instead of linear in the
# crowd size - and a dense scrum is exactly where one skater's precise bone
# pose matters least.
#
# 0 disables a threshold. Counting respects routing buckets, so another
# instance of the same spot costs this one nothing.
crowd_medium_above 8
crowd_low_above 20

# Resources started at boot, in order.
#
# Listed EXPLICITLY now rather than left blank: with no list every resource
# in sv_resources starts, which was convenient while building the test
# resources but would drop a dozen debug commands and overlapping NUI pages
# into a real game. The test resources are still on disk - add one back here
# when you need it.
#
# Markers must come first: SkateGame's lobby calls CreateMarker, which
# Markers defines.
ensure Markers
ensure SkateGame
ensure Props

# Read-only wardrobe inspection ("clothing", "outfit"). Here rather than
# treated as a test resource because the clothing catalogue is how custom
# items will be named later, and its listing is needed to find the ids to
# set in the first place.
ensure Wardrobe

# Read-only guest-memory search, used to find retail entry points in THIS
# build (the shipped image is encrypted and the sk3o decompile is a different
# build). Harmless to leave on: it can search and read, not write.
ensure Probe

# Difficulty is the server's decision - every client is set to game_difficulty
# on join and corrected if it drifts, so everyone plays the same game.
ensure Difficulty


<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Skate 3 Dev Console</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 12, 16, 0.82);
    color: #d8dee9;
    font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    font-size: 18px;
    overflow: hidden;
  }
  #log {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 46px;
    overflow-y: auto;
    padding: 8px 12px;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
    -webkit-user-select: text;
    cursor: text;
    line-height: 1.4;
  }
  #log .line { padding: 1px 0; }
  #log .resource { color: #7fb0ff; }
  #log .console { color: #f2c94c; }
  #input-row {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 46px;
    display: flex;
    align-items: center;
    background: rgba(0, 0, 0, 0.35);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
  }
  #prompt {
    padding: 0 8px 0 12px;
    color: #6bcf6b;
    user-select: none;
  }
  #cmd {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #f0f0f0;
    font: inherit;
    padding: 10px 12px 10px 0;
  }
</style>
</head>
<body>
<div id="log"></div>
<div id="input-row">
  <span id="prompt">&gt;</span>
  <input id="cmd" type="text" autocomplete="off" spellcheck="false" autofocus />
</div>
<script>
(function () {
  const logEl = document.getElementById('log');
  const cmdEl = document.getElementById('cmd');
  let cursor = 0;
  let stickToBottom = true;
  const history = [];
  let historyIndex = -1;

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function appendLine(resource, text) {
    const div = document.createElement('div');
    div.className = 'line';
    if (resource) {
      div.innerHTML = '<span class="resource">[' + escapeHtml(resource) + ']</span> ' + escapeHtml(text);
    } else if (text.startsWith('[console]')) {
      div.innerHTML = '<span class="console">' + escapeHtml(text) + '</span>';
    } else {
      div.textContent = text;
    }
    logEl.appendChild(div);
    if (stickToBottom) {
      logEl.scrollTop = logEl.scrollHeight;
    }
  }

  logEl.addEventListener('scroll', function () {
    stickToBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 24;
  });

  function poll() {
    fetch('/api/console/log?since=' + cursor)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        cursor = data.cursor;
        for (const line of data.lines) {
          appendLine(line.resource, line.text);
        }
      })
      .catch(function () { /* dev-only tool; a failed poll just retries next tick */ });
  }
  setInterval(poll, 300);
  poll();

  cmdEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      const line = cmdEl.value;
      if (line.trim().length > 0) {
        history.push(line);
        historyIndex = history.length;
        fetch('/api/console/exec', { method: 'POST', body: line });
      }
      cmdEl.value = '';
      e.preventDefault();
    } else if (e.key === 'ArrowUp') {
      if (historyIndex > 0) {
        historyIndex -= 1;
        cmdEl.value = history[historyIndex];
      }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (historyIndex < history.length - 1) {
        historyIndex += 1;
        cmdEl.value = history[historyIndex];
      } else {
        historyIndex = history.length;
        cmdEl.value = '';
      }
      e.preventDefault();
    }
  });

  cmdEl.focus();
})();
</script>
</body>
</html>
